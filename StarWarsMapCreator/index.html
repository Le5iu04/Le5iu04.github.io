    <style media="screen">
      body {
        font-size: 170%;
        background: linear-gradient(blue, black) !important;
        color: white;
        font-family: font1;
        text-align: center;
        min-height: 150%;
      }

      /* Chess-like coordinates */
      #tabl {
        border-collapse: collapse;
        margin: 20px auto;
      }

      #tabl td {
        width: 50px;
        height: 50px;
        text-align: center;
        vertical-align: middle;
      }

      .coordinate-label {
        font-weight: bold;
        color: #ffcc00;
        font-size: 1.8em;
        border: none !important;
        background: transparent !important;
      }

      .corner-cell {
        border: none !important;
        background: transparent !important;
      }

      /* Enemy token */
      .enemy-token {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        min-width: 45px;
        min-height: 45px;

        cursor: grab;
        user-select: none;
      }

      .enemy-token:active {
        cursor: grabbing;
      }

      .enemy-symbol {
        font-size: 1em;
        line-height: 1em;
      }

      .enemy-name {
        font-size: 0.55em;
        font-weight: bold;
        line-height: 1.1em;
        margin-top: 2px;
      }

      /* Playable map cells */
      .map-cell {
        cursor: default;
        position: relative;
      }

      /* When obstacle-placement mode is enabled */
      body.obstacle-mode .map-cell {
        cursor: crosshair;
      }

      /* Optional obstacle icon */
      .map-cell.obstacle::after {
        content: "\f45c";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;

        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 2.8em;
      }
    </style>

    <div id="settings">

    <script>

      let obstacleMode = false;


      function toggleObstacleMode() {

        obstacleMode = !obstacleMode;

        const button =
          document.getElementById(
            "obstacleModeButton"
          );


        if (obstacleMode) {

          button.innerText =
            "Przeszkody: WŁ.";

          document.body.classList.add(
            "obstacle-mode"
          );

        } else {

          button.innerText =
            "Przeszkody: WYŁ.";

          document.body.classList.remove(
            "obstacle-mode"
          );
        }
      }


      function toggleObstacle(cell) {

        if (!obstacleMode) {
          return;
        }

        cell.classList.toggle(
          "obstacle"
        );
      }

      /*
       * ======================================
       * ENEMY TOKENS
       * ======================================
       */

      const ENEMY_COUNT = 10;


      function createEnemyTokens() {

        const container =
          document.getElementById("enemyTokens");


        for (let i = 1; i <= ENEMY_COUNT; i++) {

          const enemy =
            document.createElement("i");


          enemy.className =
            "icon enemy-token";


          /*
           * Store the enemy name directly
           * on the HTML element.
           */
          enemy.dataset.enemyName = "E" + i;


          /*
           * Skull
           */
          const symbol =
            document.createElement("span");

          symbol.className =
            "enemy-symbol";

          symbol.innerHTML =
            '<i class="fa-solid fa-skull"></i>';


          /*
           * Enemy ID / callsign
           */
          const name =
            document.createElement("span");

          name.className =
            "enemy-name";

          name.innerText =
            enemy.dataset.enemyName;


          enemy.appendChild(symbol);
          enemy.appendChild(name);


          /*
           * Helpful tooltip
           */
          enemy.title =
            "Podwójne kliknięcie zmienia nazwę";


          /*
           * Double-click to rename enemy.
           *
           * Examples:
           *
           * ST1
           * ST2
           * DR1
           * BH1
           * TR1
           */
          enemy.addEventListener(
            "dblclick",
            function(event) {

              event.preventDefault();
              event.stopPropagation();


              const currentName =
                this.dataset.enemyName;


              let newName =
                prompt(
                  "Nazwa / oznaczenie przeciwnika:",
                  currentName
                );


              /*
               * Cancel was clicked.
               */
              if (newName === null) {
                return;
              }


              /*
               * Remove unnecessary spaces.
               */
              newName =
                newName.trim();


              /*
               * Empty value = do nothing.
               */
              if (newName === "") {
                return;
              }


              /*
               * Keep the callsign reasonably short.
               */
              if (newName.length > 8) {
                newName =
                  newName.substring(0, 8);
              }


              /*
               * Convert to uppercase.
               *
               * "st1" becomes "ST1"
               */
              newName =
                newName.toUpperCase();


              this.dataset.enemyName =
                newName;


              this.querySelector(
                ".enemy-name"
              ).innerText =
                newName;
            }
          );


          container.appendChild(enemy);
        }
      }



      /*
       * ======================================
       * DRAGGING
       * ======================================
       */

      let activeDraggable = null;

      let pos1 = 0;
      let pos2 = 0;
      let pos3 = 0;
      let pos4 = 0;



      function initializeDragging() {

        const draggables =
          document.getElementsByClassName(
            "icon"
          );


        for (
          let i = 0;
          i < draggables.length;
          i++
        ) {

          draggables[i].addEventListener(
            "mousedown",
            startDragging
          );
        }
      }



      function startDragging(event) {

        activeDraggable =
          this;


        event =
          event || window.event;


        event.preventDefault();


        pos3 =
          event.clientX;

        pos4 =
          event.clientY;


        document.addEventListener(
          "mouseup",
          closeDragElement
        );


        document.addEventListener(
          "mousemove",
          elementDrag
        );
      }



      function elementDrag(event) {

        if (!activeDraggable) {
          return;
        }


        event =
          event || window.event;


        event.preventDefault();


        pos1 =
          pos3 - event.clientX;

        pos2 =
          pos4 - event.clientY;


        pos3 =
          event.clientX;

        pos4 =
          event.clientY;


        activeDraggable.style.top =
          (
            activeDraggable.offsetTop
            - pos2
          )
          + "px";


        activeDraggable.style.left =
          (
            activeDraggable.offsetLeft
            - pos1
          )
          + "px";
      }



      function closeDragElement() {

        document.removeEventListener(
          "mouseup",
          closeDragElement
        );


        document.removeEventListener(
          "mousemove",
          elementDrag
        );


        activeDraggable =
          null;
      }



      /*
       * ======================================
       * GRID
       * ======================================
       */


      /*
       * Converts:
       *
       * 0  -> A
       * 1  -> B
       * 25 -> Z
       * 26 -> AA
       * 27 -> AB
       */
      function getColLabel(index) {

        let label = "";


        while (index >= 0) {

          label =
            String.fromCharCode(
              (index % 26) + 65
            )
            + label;


          index =
            Math.floor(index / 26) - 1;
        }


        return label;
      }



      function draw() {

        const rows =
          parseInt(
            document.getElementById(
              "width"
            ).value
          );


        const columns =
          parseInt(
            document.getElementById(
              "height"
            ).value
          );


        const table =
          document.getElementById(
            "tabl"
          );


        /*
         * Clear previous grid.
         */
        while (table.firstChild) {

          table.removeChild(
            table.firstChild
          );
        }


        /*
         * Invalid map size.
         */
        if (
          isNaN(rows)
          ||
          isNaN(columns)
          ||
          rows <= 0
          ||
          columns <= 0
        ) {

          return;
        }



        /*
         * ======================================
         * TOP COORDINATE ROW
         * ======================================
         */

        const headerRow =
          document.createElement(
            "tr"
          );


        /*
         * Empty top-left corner.
         */
        const cornerCell =
          document.createElement(
            "td"
          );


        cornerCell.className =
          "corner-cell";


        headerRow.appendChild(
          cornerCell
        );



        /*
         * A B C D E...
         */
        for (
          let j = 0;
          j < columns;
          j++
        ) {

          const cell =
            document.createElement(
              "td"
            );


          cell.className =
            "coordinate-label";


          cell.innerText =
            getColLabel(j);


          headerRow.appendChild(
            cell
          );
        }


        table.appendChild(
          headerRow
        );



        /*
         * ======================================
         * PLAYABLE GRID
         * ======================================
         */

        for (
          let i = 0;
          i < rows;
          i++
        ) {

          const row =
            document.createElement(
              "tr"
            );


          /*
           * Row number.
           */
          const numberCell =
            document.createElement(
              "td"
            );


          numberCell.className =
            "coordinate-label";


          numberCell.innerText =
            i + 1;


          row.appendChild(
            numberCell
          );



          /*
           * Playable squares.
           */
          for (
            let j = 0;
            j < columns;
            j++
          ) {

            const cell =
              document.createElement(
                "td"
              );


            cell.className =
              "map-cell";


            cell.addEventListener(
              "click",
              function() {

                toggleObstacle(this);

              }
            );


            row.appendChild(
              cell
            );
          }


          table.appendChild(
            row
          );
        }
      }



      /*
       * ======================================
       * STARTUP
       * ======================================
       */

      createEnemyTokens();

      initializeDragging();

    </script>
